[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "D100", "D103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# The container contract requires app.py to bind to all interfaces.
"app.py" = ["S104"]
"tests/*.py" = ["D", "S101"]

[tool.mypy]
python_version = "3.11"
files = ["app.py", "db.py", "habits", "insights", "tests", "ui"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
