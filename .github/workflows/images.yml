name: CI and container images

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/habits/requirements.txt
          python -m pip install -r services/habits/requirements-dev.txt
          python -m pip install -r services/insights/requirements.txt
          python -m pip install -r services/insights/requirements-dev.txt
          python -m pip install openapi-spec-validator check-jsonschema pyyaml
      - name: Run baseline tests
        run: pytest --cov=habits.schedule --cov=insights.stats --cov-report=term-missing --cov-fail-under=70
      - name: Run ruff
        run: ruff check .
      - name: Run formatter check
        run: ruff format --check .
      - name: Run mypy
        run: mypy .
      - name: Validate system schema
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: Validate OpenAPI documents
        run: |
          openapi-spec-validator services/habits/openapi.yaml
          openapi-spec-validator services/insights/openapi.yaml

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build habits image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/habits/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/devops-habit-tracker-habits:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build insights image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/insights/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/devops-habit-tracker-insights:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
