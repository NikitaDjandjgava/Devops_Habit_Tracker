services:
  habit-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
      DATA_DIR: /data
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-}"
    volumes:
      - habit-data:/data

volumes:
  habit-data:
