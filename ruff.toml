line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "S", "D100", "D103"]

[format]
quote-style = "double"
indent-style = "space"

[lint.per-file-ignores]
# The container contract requires app.py to bind to all interfaces.
"app.py" = ["S104"]
"tests/*.py" = ["D", "S101"]
